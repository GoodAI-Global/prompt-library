  - field: "date_of_loss"
    match_type: "exact"
    required: true

  - field: "policy_number"
    match_type: "exact"
    required: true

  - field: "policy_holder"
    match_type: "exact"
    required: true

  - field: "vehicle.vin"
    match_type: "exact"
    required: true

  - field: "injuries_reported"
    match_type: "exact"
    required: true

  - field: "police_report_number"
    match_type: "contains"
    required: false

expected_confidence: 0.95
expected_latency_ms: 3000
