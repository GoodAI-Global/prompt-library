name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets required - all checks are offline

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black yamllint

      - name: Lint Python with ruff
        run: ruff check src/ evals/ tests/

      - name: Check formatting with black
        run: black --check src/ evals/ tests/

      - name: Lint YAML files
        run: yamllint -d relaxed evals/config.yaml evals/test-cases/

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run offline validator
        run: python src/validate.py --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Run validator tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Run eval framework tests
        run: pytest evals/tests/ -v

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          echo "Checking for hardcoded secrets..."

          # Check for API keys
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.yaml" --include="*.md" .; then
            echo "ERROR: Potential API key found"
            exit 1
          fi

          # Check for AWS keys
          if grep -rn "AKIA[A-Z0-9]\{16\}" --include="*.py" --include="*.yaml" --include="*.md" .; then
            echo "ERROR: Potential AWS key found"
            exit 1
          fi

          echo "No secrets detected"
