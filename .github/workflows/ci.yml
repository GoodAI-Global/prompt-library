name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check evals/

      - name: Check formatting with black
        run: black --check evals/

      - name: Type check with mypy
        run: mypy evals/ --ignore-missing-imports
        continue-on-error: true  # Remove once types are fully annotated

      - name: Run tests with pytest
        run: pytest evals/tests/ --cov=evals --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml yamllint

      - name: Lint YAML files
        run: yamllint -d relaxed evals/config.yaml evals/test-cases/

      - name: Validate YAML syntax
        run: |
          python -c "
          import yaml
          import sys
          from pathlib import Path

          errors = []
          for f in Path('evals/test-cases').rglob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  errors.append(f'{f}: {e}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('All YAML files valid')
          "

      - name: Validate prompt structure
        run: |
          python -c "
          import sys
          from pathlib import Path

          required_sections = [
              '## Use Case',
              '## The Prompt',
              '## Variables',
              '## Examples',
              '## Gotchas',
              '## Model Recommendations'
          ]

          errors = []
          for category in ['operations', 'insurance', 'manufacturing', 'healthcare', 'analysis']:
              for f in Path(category).glob('*.md'):
                  content = f.read_text()
                  missing = [s for s in required_sections if s not in content]
                  if missing:
                      errors.append(f'{f}: Missing sections: {missing}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('All prompts have required sections')
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Check for common secret patterns
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.yaml" --include="*.md" .; then
            echo "ERROR: Potential API key found"
            exit 1
          fi

          # Check for AWS keys
          if grep -rn "AKIA[A-Z0-9]\{16\}" --include="*.py" --include="*.yaml" --include="*.md" .; then
            echo "ERROR: Potential AWS key found"
            exit 1
          fi

          echo "No secrets detected"

  build:
    runs-on: ubuntu-latest
    needs: [test, validate]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
